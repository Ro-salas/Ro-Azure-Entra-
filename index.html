<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Azure Static Web App</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 16px;
      max-width: 600px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      margin-bottom: 0.5rem;
      font-size: 2rem;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
    }

    button {
      margin-top: 1rem;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 0.8rem 1.2rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    #message {
      margin-top: 1rem;
      color: #7dd3fc;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to My Azure Static Web App</h1>
    <p>
      This is a basic website hosted on Azure Static Web Apps and connected to GitHub.
    </p>
    <button onclick="showMessage()">Click me</button>
    <div id="message"></div>
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "Your Static Web App is working perfectly 🎉";
    }
  </script>
</body>
</html>
